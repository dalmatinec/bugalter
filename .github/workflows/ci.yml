name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bugalter
          POSTGRES_PASSWORD: bugalter
          POSTGRES_DB: bugalter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bugalter" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://bugalter:bugalter@localhost:5432/bugalter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check bugalter migrations tests
      - run: ruff format --check bugalter migrations
      - run: pytest -q
